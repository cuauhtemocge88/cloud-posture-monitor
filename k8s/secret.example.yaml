# Copy to k8s/secret.yaml locally or create via kubectl create secret (never commit real secrets).
# Example:
#   kubectl -n posture-monitor create secret generic posture-db-secret \
#     --from-literal=POSTGRES_USER=posture \
#     --from-literal=POSTGRES_PASSWORD=change_me_local \
#     --from-literal=POSTGRES_DB=posture_db \
#     --from-literal=DATABASE_URL=postgres://posture:change_me_local@postgres:5432/posture_db
apiVersion: v1
kind: Secret
metadata:
  name: posture-db-secret
  namespace: posture-monitor
type: Opaque
stringData:
  POSTGRES_USER: posture
  POSTGRES_PASSWORD: local_lab_password_only
  POSTGRES_DB: posture_db
  DATABASE_URL: postgres://posture:local_lab_password_only@postgres:5432/posture_db
