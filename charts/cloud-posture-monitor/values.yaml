replicaCount: 2

image:
  repository: ghcr.io/cuauhtemocge88/cloud-posture-monitor
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

postgres:
  enabled: true
  image: postgres:16-alpine
  database: posture_db
  username: posture
  password: change_me_production_secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

cronjob:
  enabled: true
  schedule: "*/5 * * * *"
  image: curlimages/curl:8.10.1

networkPolicy:
  enabled: true
