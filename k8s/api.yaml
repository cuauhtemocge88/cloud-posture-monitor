apiVersion: apps/v1
kind: Deployment
metadata:
  name: posture-api
  namespace: posture-monitor
  labels:
    app: posture-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: posture-api
  template:
    metadata:
      labels:
        app: posture-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: cloud-posture-monitor:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: ALLOW_IN_MEMORY
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posture-db-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: posture-api
  namespace: posture-monitor
spec:
  selector:
    app: posture-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
