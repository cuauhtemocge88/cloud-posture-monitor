apiVersion: batch/v1
kind: CronJob
metadata:
  name: posture-scheduled-scan
  namespace: posture-monitor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: trigger-scan
              image: curlimages/curl:8.10.1
              args:
                - -sSf
                - -X
                - POST
                - http://posture-api.posture-monitor.svc.cluster.local:8080/api/scan
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
