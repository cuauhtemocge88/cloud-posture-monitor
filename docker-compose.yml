services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-posture_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posture} -d ${POSTGRES_DB:-posture_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-posture}:${POSTGRES_PASSWORD:-local_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-posture_db}
      ALLOW_IN_MEMORY: "false"
      ALLOW_PRIVATE_TARGETS: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
